name: Refresh gas data

on:
  schedule:
    # every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-gas-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch on-chain gas data
        run: python scripts/fetch_gas.py

      - name: Commit if changed
        run: |
          git config user.name "gasclock-bot"
          git config user.email "gasclock-bot@users.noreply.github.com"
          git add data/gas.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh gas data"
            git push
          fi
